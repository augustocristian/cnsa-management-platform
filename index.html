<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CNL Plataforma</title>
  <!-- CSP: own resources + Google only (sign-in, Drive, Calendar). No inline scripts. 'unsafe-inline' only for styles (views inject <style>). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com blob:; img-src 'self' data: blob: https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1a73e8">
  <meta name="description" content="Gestión de un club de natación: nadadores, entrenamientos, asistencia, cargas, marcas y calendario.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <!-- Light/dark theme before first paint (avoids a flash) -->
  <script src="./js/presentation/theme-boot.js"></script>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>
  <div id="app"><p class="boot">Cargando…</p></div>
  <div id="toasts"></div>
  <noscript><p class="boot">Esta aplicación necesita JavaScript.</p></noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
